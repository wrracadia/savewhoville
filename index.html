<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Secret</title>
<style>

    @font-face {
        font-family:'Grinchmas';
        src:url('Grinchmas-z86B0.ttf') format('truetype');
    }
    body {
        font-family: 'Grinchmas', serif;
        text-align: center;
        background: #f5f8f5;
        color: #333;
        padding: 50px 20px;
    }

    h1 {
        font-family:'Grinchmas', serif;
    }
    
    .container {
        max-width: 500px;
        margin: auto;
    }
 
    input {
        padding: 10px;
        width: 220px;
        font-size: 1rem;
        margin: 10px 0;
    }
 
    button {
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
    }
 
    .error {
        color: darkred;
        margin-top: 10px;
    }
 
    #poemPage {
        display: none;
    }
</style>
</head>
<body>
 
<div id="loginPage" class="container">
    <h1 style="font-size: 128px;">  What is the magic of Christmas?  </h1>
    <p style="font-size: 24px;"><strong>Have you UnThinged all the GibberWords?</strong></p>
 
    <input
        type="text"
        id="password"
        placeholder="Enter your answer..."
        autocomplete="off">
 
    <br>
 
    <button onclick="checkPassword()">Ask the Cat in the Hat</button>
 
    <div id="error" class="error"></div>
</div>
 
<div id="poemPage" class="container">
    <h1>  FAMILY!  </h1>
 
    <img src="GRINCH-PLOT_Storyboard.png" alt="storyboard">
</div>
 
<script>
function checkPassword() {
    const answer = document
        .getElementById("password")
        .value
        .trim()
        .toLowerCase();
 
    if (answer === "family") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("poemPage").style.display = "block";
    } else {
        document.getElementById("error").textContent =
            "  That's not the magic of Christmas. Try again.";
    }
}
</script>
 
</body>
</html>
